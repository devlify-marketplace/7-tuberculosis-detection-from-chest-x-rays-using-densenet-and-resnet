[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tb-cxr-densenet-resnet"
version = "1.0.0"
description = "Reproducible cross-dataset TB-associated chest X-ray screening research prototype"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Academic research prototype; see DATA_PROVENANCE.md for dataset terms" }
dependencies = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "numpy>=1.24,<3",
  "pandas>=2,<4",
  "Pillow>=10,<13",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
